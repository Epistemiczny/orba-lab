<style>
:root{color-scheme:dark;--bg:#101419;--panel:#1b222a;--text:#edf3f6;--muted:#a1afbc;--accent:#61d8c1}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif;overflow:hidden}main{max-width:980px;height:100dvh;height:100vh;height:100dvh;margin:auto;padding:10px 12px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);gap:8px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}small,.muted{color:var(--muted)}small{font-size:11px}button,label.file{min-height:44px;border:1px solid #35424e;border-radius:10px;background:#25303a;color:var(--text);padding:8px 12px;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--accent);color:#10241f;border-color:var(--accent);font-weight:700}button.recording{background:#e84d6c;color:white}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}.source{margin:0;flex-wrap:nowrap}.source button,.source label{flex:1;text-align:center;padding:8px 6px;white-space:nowrap}.workspace{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:8px;min-height:0}.visual,.toolbox{background:var(--panel);border:1px solid #2d3842;border-radius:14px;padding:10px;min-width:0}.topline{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:11px}.topline #name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.topline #zoomText{flex-shrink:0}.wave-wrap{position:relative}#wave{width:100%;height:clamp(108px,calc(24dvh - 32px),178px);display:block;touch-action:none;border-radius:10px;background:#121920}#magnifier{position:absolute;bottom:calc(100% + 6px);width:160px;height:46px;border:1px solid #83dcca;border-radius:8px;background:#1c2b34;pointer-events:none;z-index:3;box-shadow:0 6px 20px #0008}#overview{width:100%;height:30px;display:block;touch-action:none;margin-top:5px;border-radius:6px;background:#11181e}.zoom{flex-wrap:nowrap;margin:5px 0}.zoom button{min-height:38px;padding:5px 9px}.zoom #fitSelection{flex:1}.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:5px 0}.times label{min-width:0;font-size:11px;color:var(--muted)}.times input{width:100%;margin-top:3px;background:#11181e;color:var(--text);border:1px solid #35424e;padding:6px;border-radius:8px;font:16px system-ui;min-height:35px}.times strong{display:block;padding-top:11px;color:var(--text);font-size:15px}.transport{margin:6px 0 0;flex-wrap:nowrap}.transport button{flex:1}.toolbox{display:flex;flex-direction:column;padding:0;min-height:0;overflow:hidden}.tabs{display:flex;border-bottom:1px solid #35424e;flex-shrink:0}.tabs button{flex:1;border:0;border-radius:0;padding:7px 2px;background:transparent;font-size:13px;border-bottom:2px solid transparent;min-height:44px}.tabs button[aria-selected=true]{border-bottom-color:var(--accent);color:var(--accent);background:#61d8c10a}.panel{overflow:auto;overscroll-behavior:contain;padding:10px;flex:1;min-height:0}.panel .row:first-child{margin-top:0}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:var(--muted);font-size:12px}.duration{flex-wrap:nowrap;justify-content:space-between}.duration button{flex:1;padding:7px 3px;min-width:0}.settings{display:grid;gap:12px}.settings label{display:flex;gap:8px;align-items:center;justify-content:space-between}.settings input[type=range]{width:42%}input[type=checkbox]{accent-color:var(--accent);width:20px;height:20px}select{font:inherit;padding:6px;background:#11181e;border:1px solid #35424e;border-radius:7px}.info{padding:0;width:38px;min-width:38px;height:38px;min-height:38px;border-radius:50%;font:18px Georgia,serif;background:transparent;color:var(--muted)}#file{display:none}.statusbar{display:flex @media(min-width:750px),(max-height:500px) and (orientation:landscape){.workspace{grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);grid-template-rows:minmax(0,1fr);align-items:start}.toolbox{height:100%}.visual{height:100%;display:flex;flex-direction:column}.wave-wrap{flex:1;min-height:110px}#wave{height:100%}.topline{flex-shrink:0}.zoom,.times,.transport,#overview{flex-shrink:0}.source{justify-content:flex-start}.source button,.source label{flex:0 1 auto;min-width:110px}.panel{padding:14px}}@media(max-height:700px) and (orientation:portrait){main{gap:5px;padding-top:6px}.visual{padding:7px}#wave{height:108px}.transport button{min-height:40px}.times input{min-height:33px}.panel{padding:8px}.row{margin:5px 0}h1{font-size:16px}}@media(max-height:570px) and (orientation:portrait){#wave{height:85px}.times{margin:2px 0}.times input{min-height:30px}.source button,.source label{min-height:38px}.transport button{min-height:36px}.zoom button{min-height:32px}.tabs button{min-height:38px}}
@media(max-height:500px) and (orientation:landscape){main{gap:5px;padding-top:6px}header .info{min-height:24px;height:24px;width:24px;min-width:24px}h1{font-size:16px}.source button,.source label{min-height:36px;padding:5px 10px}.visual{padding:7px}.wave-wrap{min-height:60px}#overview{height:22px;margin-top:4px}.zoom{margin:3px 0}.zoom button{min-height:32px;height:32px;padding:3px 9px}.times{margin:3px 0}.times input{min-height:30px;padding:3px 6px;margin-top:2px}.times strong{padding-top:7px}.transport{margin:3px 0 0}.transport button{min-height:36px;padding:4px 10px}.topline{margin-bottom:4px}}
 .statusbar{display:none;position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(94vw,700px);padding:10px 12px;background:#263540;border:1px solid #53616a;border-radius:12px;box-shadow:0 6px 24px #0008;z-index:5}.statusbar.visible{display:flex}

<main><header><div><h1><img id="brandLogo" alt="Epistemic" src="logo-play.png">Sample Studio <small>· P5</small></h1></div><button class="info" data-help="general" aria-label="O edytorze">i</button></header>
<div class="row source"><button id="record">● Nagraj</button><label class="file" for="file">+ Importuj</label><input id="file" type="file" accept="audio/*"><button id="demo">Demo</button></div>
<div class="workspace"><section class="visual"><div class="topline"><span id="name">Wybierz audio lub demo</span><span id="zoomText"></span></div><div class="wave-wrap"><canvas id="wave" role="img" aria-label="Audio. Uchwyty początku i końca na dolnej krawędzi."></canvas><canvas id="magnifier" hidden aria-label="Lupa granicy cięcia"></canvas></div><canvas id="overview" role="img" aria-label="Podgląd całego nagrania"></canvas>
<div class="row zoom"><button id="minus" data-audio aria-label="Oddal">−</button><button id="plus" data-audio aria-label="Przybliż">+</button><button id="fit" data-audio>Całość</button><button id="fitSelection" data-audio>Fragment</button><button class="info" data-help="gesture" aria-label="Pomoc gestów">i</button></div>
<div class="times"><label>Początek · s<input id="start" type="number" step="0.001" min="0" data-audio></label><label>Koniec · s<input id="end" type="number" step="0.001" min="0" data-audio></label><label>Długość<strong id="length">—</strong></label></div>
<div class="row transport"><button class="primary" id="play" data-audio>▶ Odsłuch</button><button id="stop" data-audio>■ Stop</button><button id="loop" aria-pressed="false" data-audio>↻ Pętla</button></div></section>
<section class="toolbox"><div class="tabs" role="tablist" aria-label="Narzędzia samplera"><button id="tab-fragment" role="tab" aria-selected="true" aria-controls="panel-fragment" data-tab="fragment">Fragment</button><button id="tab-auto" role="tab" tabindex="-1" aria-selected="false" aria-controls="panel-auto" data-tab="auto">Auto</button><button id="tab-sound" role="tab" tabindex="-1" aria-selected="false" aria-controls="panel-sound" data-tab="sound">Brzmienie</button><button id="tab-save" role="tab" tabindex="-1" aria-selected="false" aria-controls="panel-save" data-tab="save">Zapis</button></div>
<div class="panel" id="panel-fragment" role="tabpanel" aria-labelledby="tab-fragment"><div class="panel-title"><span>Szybka długość</span><button class="info" data-help="fragment" aria-label="Pomoc zaznaczenia">i</button></div><div class="row duration"><button data-duration="1" data-audio>1 s</button><button data-duration="2" data-audio>2 s</button><button data-duration="5" data-audio>5 s</button><button data-duration="10" data-audio>10 s</button><button data-duration="20" data-audio>20 s</button></div><div class="row"><button id="lock" aria-pressed="false" data-audio>Swobodna</button><button id="undo" data-audio>↶ Cofnij</button><button id="reset" data-audio>Oryginał</button></div></div>

<div class="panel" id="panel-save" role="tabpanel" aria-labelledby="tab-save" hidden><div class="panel-title"><span>Wybrany fragment · WAV</span><button class="info" data-help="save" aria-label="Pomoc eksportu">i</button></div><div class="row"><button class="primary" id="export" data-audio>↓ Zapisz WAV</button></div></div></section></div>
<div class="statusbar"><div id="status" role="status" aria-live="polite">Wybierz demo, import lub nagranie.</div><button class="info" id="statusHelp" aria-label="Pełny komunikat">i</button></div></main>
<dialog id="help"><h2 id="helpTitle"></h2><p id="helpText"></p><button id="closeHelp">Rozumiem</button></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),wave=$('wave'),overview=$('overview');
const S={buffer:null,a:0,b:0,v:0,span:0,locked:false,loop:false,history:[],source:null,recorder:null,stream:null,pointers:new Map(),gesture:null,loupe:null,peaks:null};
let audio;function ctx(){return audio ||= new (window.AudioContext||window.webkitAudioContext)()}
let noticeTimer;function say(t){$('status').textContent=t;$('status').title=t;const important=/Nie udało|Nie można|Mikrofon:|nie jest dostępne|Nagrywanie|Zapisano|praktycznie ciche|Nie znaleziono/.test(t);const bar=document.querySelector('.statusbar');clearTimeout(noticeTimer);bar.classList.toggle('visible',important);if(important)noticeTimer=setTimeout(()=>bar.classList.remove('visible'),6500)}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function total(){return S.buffer?.duration||0}function epsilon(){return 1/(S.buffer?.sampleRate||48000)}
function remember(){S.history.push([S.a,S.b]);if(S.history.length>40)S.history.shift()}
function bounds(a,b){const t=total();S.a=clamp(a,0,Math.max(0,t-epsilon()));S.b=clamp(b,S.a+epsilon(),t)}
function setBoundary(which,value){if(S.locked){const len=S.b-S.a;S.a=clamp(which==='start'?value:value-len,0,total()-len);S.b=S.a+len}else if(which==='start')bounds(Math.min(value,S.b-epsilon()),S.b);else bounds(S.a,Math.max(value,S.a+epsilon()))}
function view(v,span){S.span=clamp(span,Math.min(.025,total()),total());S.v=clamp(v,0,total()-S.span)}
function update(){document.querySelectorAll('[data-audio]').forEach(e=>e.disabled=!S.buffer);$('start').value=S.buffer?S.a.toFixed(3):'';$('end').value=S.buffer?S.b.toFixed(3):'';$('length').textContent=S.buffer?(S.b-S.a).toFixed(3)+' s':'—';$('zoomText').textContent=S.buffer?(total()/S.span).toFixed(1)+'× · '+S.span.toFixed(2)+' s':'';$('lock').setAttribute('aria-pressed',S.locked);$('lock').textContent=S.locked?'Długość stała':'Swobodna';$('loop').setAttribute('aria-pressed',S.loop);$('undo').disabled=!S.buffer||!S.history.length;draw()}
function canvas(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const g=c.getContext('2d');g.scale(d,d);return [g,r.width,r.height]}
function trace(g,w,h,v,span,color){if(!S.buffer)return;g.strokeStyle=color;g.lineWidth=1;g.beginPath();const sr=S.buffer.sampleRate,n=S.buffer.length;
 for(let x=0;x<w;x++){const first=Math.floor((v+x/w*span)*sr),last=Math.min(n,Math.max(first+1,Math.ceil((v+(x+1)/w*span)*sr)));let lo=0,hi=0;for(let ch=0;ch<S.buffer.numberOfChannels;ch++){const a=S.buffer.getChannelData(ch),cache=S.peaks[ch];let i=first;while(i<last){if(i%128===0&&i+128<=last){lo=Math.min(lo,cache.lo[i/128]);hi=Math.max(hi,cache.hi[i/128]);i+=128}else{lo=Math.min(lo,a[i]);hi=Math.max(hi,a[i]);i++}}}g.moveTo(x,h/2-hi*h*.36);g.lineTo(x,h/2-lo*h*.36)}g.stroke()}
function draw(){let [g,w,h]=canvas(wave);g.fillStyle='#121920';g.fillRect(0,0,w,h);const lens=$('magnifier');lens.hidden=S.loupe===null;if(!S.buffer){g.fillStyle='#91a3b1';g.textAlign='center';g.font='13px system-ui';g.fillText('Wybierz nagranie lub demo',w/2,h/2);canvas(overview);return}const x=t=>(t-S.v)/S.span*w,plot=h-14;
g.fillStyle='#61d8c119';g.fillRect(x(S.a),0,x(S.b)-x(S.a),plot);trace(g,w,plot,S.v,S.span,'#71bfb7');
for(let i=0;i<=4;i++){g.fillStyle='#91a3b1';g.font='10px system-ui';g.textAlign=i===4?'right':'left';g.fillText((S.v+S.span*i/4).toFixed(2)+' s',w*i/4,plot-3)}
g.fillStyle='#19232b';g.fillRect(0,plot,w,14);
for(const [t,label] of [[S.a,'START'],[S.b,'KONIEC']]){const p=x(t);if(p<0||p>w)continue;g.strokeStyle='#80f0d6';g.lineWidth=1.5;g.beginPath();g.moveTo(p,15);g.lineTo(p,plot+8);g.stroke();g.fillStyle='#61d8c1';const xx=clamp(p-9,0,w-18);g.beginPath();g.roundRect(xx,plot+1,18,12,4);g.fill();g.fillStyle='#14312a';g.textAlign='center';g.font='bold 10px system-ui';g.fillText('⋮',xx+9,plot+11);g.fillStyle='#b7ddd6';g.font='9px system-ui';g.textAlign=p>w/2?'right':'left';g.fillText(label,p,12)}
const cursor=playbackTime();if(cursor!==null&&cursor>=S.v&&cursor<=S.v+S.span){g.strokeStyle='#ffce66';g.lineWidth=2;g.beginPath();g.moveTo(x(cursor),0);g.lineTo(x(cursor),plot);g.stroke();g.fillStyle='#ffce66';g.beginPath();g.moveTo(x(cursor)-5,0);g.lineTo(x(cursor)+5,0);g.lineTo(x(cursor),7);g.fill()}
if(S.loupe!==null){const t=S.loupe;const span=Math.min(total(),S.span/10),v=clamp(t-span/2,0,total()-span);lens.style.left=clamp(x(t)-80,0,w-160)+'px';let [lg,lw,lh]=canvas(lens);lg.fillStyle='#1c2b34';lg.fillRect(0,0,lw,lh);trace(lg,lw,lh,v,span,'#a2f0df');lg.strokeStyle='#fff';lg.beginPath();lg.moveTo((t-v)/span*lw,0);lg.lineTo((t-v)/span*lw,lh);lg.stroke()}
[g,w,h]=canvas(overview);g.fillStyle='#11181e';g.fillRect(0,0,w,h);trace(g,w,h,0,total(),'#587b85');g.fillStyle='#61d8c12b';g.fillRect(S.a/total()*w,0,(S.b-S.a)/total()*w,h);g.strokeStyle='#a4b9ca';g.lineWidth=2;g.strokeRect(S.v/total()*w,2,S.span/total()*w,h-4);if(cursor!==null){g.strokeStyle='#ffce66';g.beginPath();g.moveTo(cursor/total()*w,0);g.lineTo(cursor/total()*w,h);g.stroke()}}
function load(buffer,name){stop();S.buffer=buffer;S.fileName=name;S.peaks=Array.from({length:buffer.numberOfChannels},(_,c)=>{const a=buffer.getChannelData(c),lo=new Float32Array(Math.ceil(a.length/128)),hi=new Float32Array(lo.length);for(let i=0;i<a.length;i++){const j=Math.floor(i/128);lo[j]=Math.min(lo[j],a[i]);hi[j]=Math.max(hi[j],a[i])}return {lo,hi}});S.a=0;S.b=buffer.duration;S.v=0;S.span=buffer.duration;S.history=[];S.locked=false;S.pointers.clear();S.gesture=null;S.loupe=null;$('name').textContent=name+' · '+buffer.duration.toFixed(2)+' s';update();say('Przesuń uchwyty lub wybierz „Przytnij ciszę”. Oryginał pozostaje zachowany.')}
async function importFile(file){if(!file)return;try{const b=await ctx().decodeAudioData(await file.arrayBuffer());load(b,file.name)}catch(e){say('Nie udało się odczytać audio. Spróbuj WAV, MP5 lub M4A obsługiwanego przez przeglądarkę.')}}
function autoTrim(){if(!S.buffer)return;const b=S.buffer,sr=b.sampleRate,win=Math.max(1,Math.round(sr*.005)),levels=[];let peak=0;
 for(let i=0;i<b.length;i+=win){let sum=0,count=0;for(let c=0;c<b.numberOfChannels;c++){const a=b.getChannelData(c);for(let j=i;j<Math.min(i+win,b.length);j++){sum+=a[j]*a[j];count++}}const rms=Math.sqrt(sum/count);levels.push(rms);peak=Math.max(peak,rms)}
 if(peak<1e-6){say('Nagranie jest praktycznie ciche. Pozostawiłem zaznaczenie.');return}const sorted=[...levels].sort((a,b)=>a-b),noise=sorted[Math.floor(sorted.length*.15)],sens=Number($('sensitivity').value)/100;
 const threshold=Math.max(peak*Math.pow(10,(-18-30*sens)/20),Math.min(peak*.4,noise*(3-2*sens)));let first=levels.findIndex(x=>x>threshold),last=levels.findLastIndex(x=>x>threshold);
 if(first<0){say('Nie znaleziono wyraźnego dźwięku. Ustaw granice ręcznie.');return}remember();bounds(first*win/sr-.015,(last+1)*win/sr+.05);update();say('Zaproponowane granice: '+S.a.toFixed(3)+'–'+S.b.toFixed(3)+' s. To granice dźwięku względem ciszy, nie wybór sampla z piosenki.')}
function processed(){const b=S.buffer;if(!b)return null;const begin=Math.floor(S.a*b.sampleRate),finish=Math.min(b.length,Math.ceil(S.b*b.sampleRate)),n=Math.max(1,finish-begin),out=ctx().createBuffer(Math.min(2,b.numberOfChannels),n,b.sampleRate);let peak=0;
 for(let c=0;c<out.numberOfChannels;c++){out.copyToChannel(b.getChannelData(c).subarray(begin,finish),c);for(const x of out.getChannelData(c))peak=Math.max(peak,Math.abs(x))}const gain=( $('normalize').checked&&peak>0?.95/peak:1)*Math.pow(10,Number($('gain').value)/20),fade=Math.min(Math.floor(n/2),Math.round(Number($('fade').value)*b.sampleRate/1000));
 for(let c=0;c<out.numberOfChannels;c++){const a=out.getChannelData(c);for(let i=0;i<n;i++){const ramp=fade?Math.min(1,i/fade,(n-1-i)/fade):1;a[i]=clamp(a[i]*gain*ramp,-1,1)}}return out}
let playback=null,playFrame=0;
function playbackTime(){if(!playback)return null;const elapsed=Math.max(0,ctx().currentTime-playback.started),d=playback.duration;return playback.a+(S.source?.loop?elapsed%d:Math.min(elapsed,d))}
function animatePlay(){draw();if(S.source)playFrame=requestAnimationFrame(animatePlay)}
function stop(){cancelAnimationFrame(playFrame);playback=null;if(S.source){try{S.source.stop()}catch{}S.source=null}$('play').textContent='▶ Odsłuch';draw()}
async function play(){if(!S.buffer)return;try{await ctx().resume();stop();const s=ctx().createBufferSource();s.buffer=processed();s.loop=S.loop;s.connect(ctx().destination);S.source=s;s.onended=()=>{if(S.source===s){S.source=null;playback=null;cancelAnimationFrame(playFrame);draw();$('play').textContent='▶ Odsłuch';draw()}};playback={a:S.a,duration:s.buffer.duration,started:ctx().currentTime};s.start();animatePlay();$('play').textContent='▶ Gra…'}catch(e){say('Nie można uruchomić odsłuchu: '+e.message)}}
function wav(b){const channels=b.numberOfChannels,n=b.length,bytes=n*channels*2,a=new ArrayBuffer(44+bytes),v=new DataView(a);const text=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));text(0,'RIFF');v.setUint32(4,36+bytes,true);text(8,'WAVE');text(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,channels,true);v.setUint32(24,b.sampleRate,true);v.setUint32(28,b.sampleRate*channels*2,true);v.setUint16(32,channels*2,true);v.setUint16(34,16,true);text(36,'data');v.setUint32(40,bytes,true);let o=44;for(let i=0;i<n;i++)for(let c=0;c<channels;c++){const x=clamp(b.getChannelData(c)[i],-1,1);v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}return new Blob([a],{type:'audio/wav'})}
function zoom(f,anchor=.5){const t=S.v+S.span*anchor;view(t-S.span/f*anchor,S.span/f);update()}
function position(e,c=wave){const r=c.getBoundingClientRect();return clamp(e.clientX-r.left,0,r.width)}let magnet=false;
function snapEdge(t,which){if(!magnet||!S.buffer)return t;const b=S.buffer,sr=b.sampleRate,step=Math.max(1,Math.round(sr*.002)),radius=Math.min(.15,Math.max(.012,S.span*24/wave.getBoundingClientRect().width));const from=Math.max(0,Math.floor((t-radius-.025)*sr)),to=Math.min(b.length,Math.ceil((t+radius+.025)*sr));let levels=[],peak=0;for(let i=from;i<to;i+=step){let sum=0,n=0;for(let c=0;c<b.numberOfChannels;c++){const a=b.getChannelData(c);for(let j=i;j<Math.min(i+step,to);j++){sum+=a[j]*a[j];n++}}const rms=Math.sqrt(sum/n);levels.push(rms);peak=Math.max(peak,rms)}if(peak<1e-5)return t;const floor=Math.max(1e-5,peak*.025);let best=t,dist=radius;for(let i=3;i<levels.length-3;i++){const before=(levels[i-3]+levels[i-2]+levels[i-1])/3,after=(levels[i]+levels[i+1]+levels[i+2])/3;const edge=which==='start'?after>floor&&after>before*3:before>floor&&after<floor&&before>after*3;if(!edge)continue;const candidate=(from+i*step)/sr+(which==='start'?-.003:.005),d=Math.abs(candidate-t);if(d<dist){best=candidate;dist=d}}return clamp(best,0,total())}
function chooseStart(t){remember();stop();S.locked=false;const start=clamp(snapEdge(t,'start'),0,total()-epsilon());bounds(start,S.b>start+epsilon()?S.b:Math.min(total(),start+1));update()}
function at(x){return S.v+x/wave.getBoundingClientRect().width*S.span}
wave.addEventListener('pointerdown',e=>{if(!S.buffer)return;e.preventDefault();wave.setPointerCapture(e.pointerId);S.pointers.set(e.pointerId,position(e));if(S.pointers.size===2){const p=[...S.pointers.values()];S.gesture={type:'pinch',distance:Math.max(1,Math.abs(p[1]-p[0])),span:S.span,anchor:at((p[0]+p[1])/2)};S.loupe=null;return}if(S.pointers.size!==1)return;const x=position(e),w=wave.getBoundingClientRect().width,xa=(S.a-S.v)/S.span*w,xb=(S.b-S.v)/S.span*w,da=Math.abs(x-xa),db=Math.abs(x-xb);const r=wave.getBoundingClientRect();const nearGrip=e.clientY-r.top>=r.height-46;const edge=nearGrip&&Math.min(da,db)<=24?(da<=db?'start':'end'):null;S.gesture={type:edge||'pan',x,y:e.clientY,moved:false,t:at(x),v:S.v,a:S.a,b:S.b};if(edge){remember();S.loupe=edge==='start'?S.a:S.b;draw()}});
wave.addEventListener('pointermove',e=>{if(!S.pointers.has(e.pointerId))return;e.preventDefault();S.pointers.set(e.pointerId,position(e));const g=S.gesture;if(!g)return;const w=wave.getBoundingClientRect().width;if(g.type==='pinch'&&S.pointers.size>=2){const p=[...S.pointers.values()],mid=(p[0]+p[1])/2,span=clamp(g.span*g.distance/Math.max(1,Math.abs(p[1]-p[0])),Math.min(.025,total()),total());view(g.anchor-mid/w*span,span)}else if(g.type==='pan'){if(Math.hypot(position(e)-g.x,e.clientY-g.y)>7)g.moved=true;if(g.moved)view(g.v-(position(e)-g.x)/w*S.span,S.span)}else if(g.type==='start'||g.type==='end'){stop();const raw=(g.type==='start'?g.a:g.b)+(position(e)-g.x)/w*S.span;setBoundary(g.type,S.locked?raw:snapEdge(raw,g.type));S.loupe=g.type==='start'?S.a:S.b}update()});
function release(e){const g=S.gesture;if(e.type==='pointerup'&&S.pointers.size===1&&g?.type==='pan'&&!g.moved&&Number.isFinite(g.t))chooseStart(g.t);S.pointers.delete(e.pointerId);S.loupe=null;S.gesture=null;if(S.pointers.size===1){const x=[...S.pointers.values()][0];S.gesture={type:'pan',x,v:S.v}}update()}wave.addEventListener('pointerup',release);wave.addEventListener('pointercancel',release);wave.addEventListener('wheel',e=>{if(!S.buffer)return;e.preventDefault();zoom(e.deltaY<0?1.3:1/1.3,position(e)/wave.getBoundingClientRect().width)},{passive:false});
function overviewMove(e){if(!S.buffer)return;const w=overview.getBoundingClientRect().width;view(position(e,overview)/w*total()-S.span/2,S.span);update()}overview.addEventListener('pointerdown',e=>{overview.setPointerCapture(e.pointerId);overviewMove(e)});overview.addEventListener('pointermove',e=>{if(overview.hasPointerCapture(e.pointerId))overviewMove(e)});
$('file').onchange=e=>importFile(e.target.files[0]);$('plus').onclick=()=>zoom(2);$('minus').onclick=()=>zoom(.5);$('fit').onclick=()=>{view(0,total());update()};$('fitSelection').onclick=()=>{const padding=(S.b-S.a)*.1;view(S.a-padding,(S.b-S.a)+2*padding);update()};$('lock').onclick=()=>{S.locked=!S.locked;update()};$('loop').onclick=()=>{S.loop=!S.loop;if(S.source)S.source.loop=S.loop;update()};$('play').onclick=play;$('stop').onclick=stop;
for(const id of ['start','end'])$(id).onchange=()=>{const val=Number($(id).value);if(!Number.isFinite(val)){update();return}remember();setBoundary(id,val);stop();update()};document.querySelectorAll('[data-duration]').forEach(el=>el.onclick=()=>{remember();const len=Math.min(Number(el.dataset.duration),total());bounds(S.a,Math.min(total(),S.a+len));stop();update()});

$('trim').onclick=()=>{stop();autoTrim()};$('undo').onclick=()=>{const h=S.history.pop();if(h){stop();bounds(...h);update()}};$('reset').onclick=()=>{remember();stop();bounds(0,total());view(0,total());update()};$('sensitivity').oninput=()=>{$('sensValue').textContent=$('sensitivity').value+'%'};$('gain').oninput=()=>{$('gainValue').textContent=$('gain').value+' dB'};
function exportName(){const base=(S.fileName||'nagranie').replace(/\.[^.]+$/,'').normalize('NFKC').replace(/[<>:"/\\|?*\x00-\x1f]/g,'-').slice(0,70);const stamp=new Date().toISOString().replace(/[-:]/g,'').replace('T','_').replace('Z','');return base+'_'+S.a.toFixed(3)+'-'+S.b.toFixed(3)+'s_'+stamp+'.wav'}

$('demo').onclick=()=>{const sr=48000,b=ctx().createBuffer(1,sr*8,sr),a=b.getChannelData(0);for(let i=0;i<a.length;i++){const t=i/sr;if(t>=2&&t<3.2)a[i]=.65*Math.sin(2*Math.PI*220*(t-2))*Math.exp(-(t-2)*3);if(t>=5&&t<5.3)a[i]=.35*Math.sin(2*Math.PI*650*(t-5))*Math.exp(-(t-5)*15)}load(b,'Demo · dwa dźwięki')};
let recordingBusy=false;
$('record').onclick=async()=>{if(recordingBusy)return;if(S.recorder?.state==='recording'){S.recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){say('Nagrywanie nie jest dostępne w tym widoku. Otwórz edytor w Chrome przez HTTPS lub localhost; możesz też zaimportować nagranie z telefonu.');return}recordingBusy=true;$('record').disabled=true;try{await ctx().resume();stop();S.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});const chunks=[],r=new MediaRecorder(S.stream);S.recorder=r;r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const timer=setTimeout(()=>{if(r.state==='recording')r.stop()},120000);r.onstop=async()=>{clearTimeout(timer);S.stream?.getTracks().forEach(t=>t.stop());S.stream=null;S.recorder=null;$('record').classList.remove('recording');$('record').textContent='● Nagraj';try{const b=await ctx().decodeAudioData(await new Blob(chunks,{type:r.mimeType}).arrayBuffer());load(b,'Nagranie mikrofonu');if($('auto').checked)autoTrim()}catch(e){say('Nie udało się odczytać nagrania. Spróbuj importu pliku.')}};r.start();$('record').classList.add('recording');$('record').textContent='■ Zakończ';say('Nagrywanie… dotknij „Zakończ”. Limit tego prototypu: 2 minuty.')}catch(e){S.stream?.getTracks().forEach(t=>t.stop());S.stream=null;say('Mikrofon: '+e.message)}finally{recordingBusy=false;$('record').disabled=false}};
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===parent&&e.data?.type==='studio-visibility'&&!e.data.visible){stop();if(S.recorder?.state==='recording')S.recorder.stop()}});if(new URLSearchParams(location.search).has('embedded')){document.body.classList.add('embedded')}window.addEventListener('resize',draw);window.addEventListener('pagehide',()=>{stop();S.stream?.getTracks().forEach(t=>t.stop())});update();

const HELP={snap:['Magnes','Włączony magnes szuka pobliskiego wyraźnego początku lub końca dźwięku. Początek dostaje 3 ms zapasu, koniec 5 ms. Nie dodaje sztucznej ciszy: zachowuje ten fragment oryginału. Przy ciągłej muzyce może nie znaleźć granicy i wtedy pozostawia pozycję ręczną. Przy stałej długości przyciąganie uchwytów jest wyłączone, żeby nie zmienić długości.'],general:['Sample Studio P5','Nagranie i obróbka działają lokalnie w przeglądarce. Ten prototyp eksportuje WAV; nie wysyła jeszcze sampli do Orby. Mikrofon wymaga obsługiwanej przeglądarki i uprawnień.'],gesture:['Wybieranie fragmentu','Dotknij górnego wykresu, aby ustawić START i tryb Swobodna. Przeciągnij, aby przesunąć widok. Przyciski sekund zachowują START; przy końcu pliku fragment jest krótszy.\nUchwyty są na dolnym pasku pod przebiegiem. Chwyć przy początku lub końcu i przesuń palec w bok. Lupa pokazuje miejsce cięcia ponad wykresem.\nDwa palce przybliżają audio. Przeciągnięcie tła przesuwa widok bez zmiany granic. Dolny podgląd pozwala przeskakiwać po nagraniu.'],fragment:['Długość i granice','Przyciski sekund ustawiają długość fragmentu. „Długość stała” przesuwa obie granice razem. „Swobodna” pozwala zmieniać każdą oddzielnie. Cofnij przywraca poprzednie zaznaczenie; Oryginał zaznacza całe audio.'],auto:['Przycinanie ciszy','Ta opcja znajduje początek i koniec dźwięku. W piosence bez ciszy może objąć niemal cały utwór. Nie wybiera automatycznie uderzenia ani najlepszego sampla. Wybierz fragment uchwytami i powiększ go.\nWiększa czułość zachowuje cichsze dźwięki i więcej tła. Automat proponuje granice z małym zapasem; sprawdź je odsłuchem. Nie usuwa oryginalnego nagrania. W hałasie granice mogą wymagać ręcznej poprawki.'],sound:['Poziom i krawędzie','Wyrównanie poziomu ustawia szczyt na 95%. Głośność zmienia poziom po wyrównaniu; dodatnie wartości mogą powodować obcięcie szczytów. Wygładzanie krawędzi łagodzi początek i koniec, ograniczając trzaski. Ustawienia stosowane są do kolejnego odsłuchu i eksportu.'],save:['Eksport WAV','Zapisywany jest zaznaczony fragment: PCM 16-bit, maksymalnie dwa kanały, częstotliwość nagrania. Uwzględnia ustawienia z Brzmienia. To przygotowany plik audio, nie kompletny preset instrumentu.']};
